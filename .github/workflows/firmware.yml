name: Firmware bauen und veröffentlichen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: PlatformIO installieren
        run: python -m pip install platformio==6.2.0
      - name: Firmware für D1 mini kompilieren
        run: pio run -e d1_mini
      - name: Regressionstests ausführen
        run: python scripts/run_checks.py
      - name: Firmware und Prüfsummen zusammenstellen
        run: python scripts/package_firmware.py
      - name: Firmware als Download bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: firmware-d1-mini-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-d1-mini-${{ github.sha }}
          path: dist/
      - name: Prüfsummen vor Veröffentlichung prüfen
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
